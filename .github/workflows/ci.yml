# Everything runs through the Makefile, in Docker, as on a laptop: `make check integration fuzz`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays: a new Talos release is tested without waiting for a push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: amd64

defaults:
  run:
    shell: bash # -o pipefail: a failing make is not hidden by tee

jobs:
  check:
    name: Unit tests, schema, example configs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # gofmt, go vet, unit tests (among them: the committed JSON schema is up to date), then every
      # example and variant through nft, Kea, Unbound, radvd, chrony, inadyn and talosctl validate
      - run: make check 2>&1 | tee ci.log
      - name: Failure summary
        if: failure()
        run: hack/ci-summary.sh ci.log

  integration:
    name: Lab (network namespaces)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # the lab needs VLANs, WireGuard and PPP from the runner's kernel
      - name: Kernel modules
        run: |
          mods="8021q wireguard ppp_generic nf_tables nft_chain_nat nft_masq nft_fib_inet"
          sudo modprobe -a $mods || {
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe -a $mods
          }
      # AppArmor profiles of the runner match by path, inside containers too: the host's chronyd
      # profile would keep the lab's chronyd from reading its config under /var/lib/routal
      - name: Host AppArmor profiles of the lab's daemons
        run: |
          for p in /etc/apparmor.d/usr.sbin.chronyd /etc/apparmor.d/usr.sbin.unbound /etc/apparmor.d/usr.sbin.kea-dhcp* /etc/apparmor.d/usr.sbin.avahi-daemon; do
            if [ -f "$p" ]; then sudo apparmor_parser -R "$p" || true; fi
          done
      - run: make integration 2>&1 | tee ci.log
      - name: Failure summary
        if: failure()
        run: hack/ci-summary.sh ci.log

  fuzz:
    name: Fuzzing (30 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: make fuzz FUZZTIME=30s
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            _out/fuzz/*.log
            **/testdata/fuzz/
          if-no-files-found: ignore

  extension:
    name: Extension image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v5
      - run: make extension ARCH=${{ matrix.arch }}

  talos-versions:
    name: Talos versions to test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      # the last three releases of each supported Talos line (1.14 and 1.15)
      - id: list
        run: |
          versions=$(hack/talos-versions.sh)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Talos versions: $versions" >> "$GITHUB_STEP_SUMMARY"

  talos:
    name: Talos ${{ matrix.talos }}
    needs: talos-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        talos: ${{ fromJSON(needs.talos-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
      # every example's talos.yaml through this version's talosctl, then its installer image with
      # the extension (the imager checks the extension against this version)
      - run: |
          { make check-talos TALOS_VERSION=${{ matrix.talos }} &&
            make installer TALOS_VERSION=${{ matrix.talos }}; } 2>&1 | tee ci.log
      # the same version for real: boots the image in QEMU (KVM), checks the extension, the daemons'
      # accounts and capabilities and the WAN side, then plays the personas of test/vm/personas
      - name: VM tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf dnsmasq-base netcat-openbsd busybox-static bind9-dnsutils socat miniupnpc wireguard-tools
          sudo modprobe wireguard
      - name: Boot test
        run: make vm-test TALOS_VERSION=${{ matrix.talos }} 2>&1 | tee ci.log
      - name: Failure summary
        if: failure()
        run: hack/ci-summary.sh ci.log
