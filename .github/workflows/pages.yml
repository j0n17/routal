# Publishes the project's web page (make site) with GitHub Pages: the reference of router.yaml,
# the example routers and the personas. Needs Pages enabled on the repository, with
# "GitHub Actions" as the source (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
    paths: [pkg/schema/**, docs/**, examples/**, test/vm/personas/**, hack/site/**, assets/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The checkout belongs to the runner's user and the build runs as root in a container: git
      # refuses to answer there, and go build wants the commit to stamp the binary with.
      - run: make site GO_IMAGE="-e GOFLAGS=-buildvcs=false golang:1.26"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _out/site

  # its own job: the artifact of a job is only there for the deployment once that job has ended
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
