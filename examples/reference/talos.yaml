# Reference: the Talos documents a Routal router uses, matching router.yaml next to it.
# Apply on top of `talosctl gen config --skip-k8s-etcd` (Kubernetes-free). Checked with
# `talosctl validate --mode metal` (Talos v1.15) after `routald talos-render`. Talos' own docs
# list every field.
#
# Do not write ExtensionServiceConfig or routal-* NetworkRuleConfig documents by hand:
# `routald talos-patch` generates them from router.yaml.

# Install with Routal's installer (`make installer push-installer`), not the stock one: the stock
# installer would install Talos without the routald extension.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: ghcr.io/example/routal-installer:v0.1.0
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: router
---
# Stable names for the NICs, whatever the kernel calls them (router.yaml uses these names).
apiVersion: v1alpha1
kind: LinkAliasConfig
name: wan0
selector:
  match: mac(link.permanent_addr) == "52:54:00:00:00:01"
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: lan0
selector:
  match: mac(link.permanent_addr) == "52:54:00:00:00:02"
---
# WAN: the ISP wants PPPoE on VLAN 832 (routald dials it: PPPoEConfig in router.yaml).
# With a DHCP ISP instead: `kind: DHCPv4Config` / `kind: DHCPv6Config` with `name: wan0`.
apiVersion: v1alpha1
kind: LinkConfig
name: wan0
up: true
---
apiVersion: v1alpha1
kind: VLANConfig
name: wan832
vlanID: 832
parent: wan0
up: true
---
# LAN: static addresses, plus a static route to a network behind another router.
apiVersion: v1alpha1
kind: LinkConfig
name: lan0
up: true
mtu: 1500
addresses:
  - address: 192.168.1.1/24
  - address: fd00:1::1/64
routes:
  - destination: 192.168.50.0/24
    gateway: 192.168.1.254
---
# VLANs on the LAN port (the switch port is a trunk).
apiVersion: v1alpha1
kind: VLANConfig
name: guest0
vlanID: 20
parent: lan0
up: true
addresses:
  - address: 192.168.20.1/24
---
apiVersion: v1alpha1
kind: VLANConfig
name: srv0
vlanID: 30
parent: lan0
up: true
addresses:
  - address: 192.168.30.1/24
  - address: fd00:30::1/64
---
# Remote access. Secrets are file references, resolved by `routald talos-render talos.yaml`
# (paths relative to this file): privateKeyFile -> privateKey, presharedKeyFile -> presharedKey.
# secrets/ is in .gitignore; the files here are placeholders. Public keys are not secret.
apiVersion: v1alpha1
kind: WireguardConfig
name: wg0
privateKeyFile: secrets/wg0.key # wg genkey > secrets/wg0.key (kept out of git)
listenPort: 51820
peers:
  - publicKey: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBA= # placeholder: the laptop on the road
    presharedKeyFile: secrets/laptop.psk # optional: wg genpsk > secrets/laptop.psk
    allowedIPs:
      - 10.8.0.2/32
      - fd00:8::2/128
up: true
addresses:
  - address: 10.8.0.1/24
  - address: fd00:8::1/64
---
# Dynamic routing: Talos speaks BGP itself (the `bgp` rule in router.yaml lets the neighbor in).
# VRFs (`kind: VRFConfig`, then `vrf:` here) and policy routing (`kind: RoutingRuleConfig`) are
# Talos documents too: see examples/bgp-vrf.
apiVersion: v1alpha1
kind: BGPInstanceConfig
name: core
localASN: 65001
routerID: 192.168.1.1
advertise: [srv0] # announce the networks of these links
neighbors:
  - address: 192.168.1.254
    peerASN: 65002
---
# Ingress firewall for the router itself: deny by default. routald's `to: self` rules add
# routal-* NetworkRuleConfig documents next to these.
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
# The Talos API (talosctl) from the LAN and the VPN only.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: talos-api
portSelector:
  ports: [50000]
  protocol: tcp
ingress:
  - subnet: 192.168.1.0/24
  - subnet: fd00:1::/64
  - subnet: 10.8.0.0/24
---
# Optional: pull the Routal installer from a private registry.
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: registry.example.org
endpoints:
  - url: https://registry.example.org
