# A NAS reachable from the LAN and over WireGuard, never from the Internet. IPv4 and IPv6.
apiVersion: v1alpha1
kind: FirewallConfig
logBlocked: true
---
apiVersion: v1alpha1
kind: FirewallZoneConfig
name: wan
links: [wan0]
---
apiVersion: v1alpha1
kind: FirewallZoneConfig
name: lan
links: [lan0]
---
apiVersion: v1alpha1
kind: FirewallZoneConfig
name: servers
links: [srv0]
---
apiVersion: v1alpha1
kind: FirewallZoneConfig
name: vpn
links: [wg0]
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: lan-to-wan
from: lan
to: wan
---
# The NAS can fetch updates.
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: servers-to-wan
from: servers
to: wan
---
# Named groups, used by the rules below (nftables sets on the router).
apiVersion: v1alpha1
kind: FirewallAddressGroupConfig
name: nas
subnets: [192.168.30.10/32, fd00:30::10/128]
---
apiVersion: v1alpha1
kind: FirewallPortGroupConfig
name: nas_ui
ports: [443]
---
# NAS web UI from the LAN and from the VPN, both address families. Nothing else on the NAS.
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: lan-to-nas
from: lan
to: servers
protocol: tcp
portGroups: [nas_ui]
destinationGroups: [nas]
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: vpn-to-nas
from: vpn
to: servers
protocol: tcp
portGroups: [nas_ui]
destinationGroups: [nas]
---
# Already blocked by the default policy; explicit so that attempts are logged under their own name.
# This matters for IPv6, where the NAS address is routable and there is no NAT in the way.
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: wan-to-servers
from: wan
to: servers
action: block
log: true
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: wireguard
from: wan
to: self
protocol: udp
ports: [51820]
---
# DNS and DHCP on the router, from the inside zones only.
apiVersion: v1alpha1
kind: FirewallPortGroupConfig
name: dns_dhcp
ports: [53, 67]
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: lan-dns-dhcp
from: lan
to: self
protocol: udp
portGroups: [dns_dhcp]
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: servers-dns-dhcp
from: servers
to: self
protocol: udp
portGroups: [dns_dhcp]
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: vpn-dns
from: vpn
to: self
protocol: udp
ports: [53]
---
# IPv4 only: IPv6 is routed without NAT.
apiVersion: v1alpha1
kind: MasqueradeConfig
name: out
outLink: wan0
sourceSubnets: [192.168.1.0/24, 192.168.30.0/24, 10.8.0.0/24]
---
# Served by dnsmasq inside the routald extension.
apiVersion: v1alpha1
kind: DHCPServerConfig
name: lan
link: lan0
rangeStart: 192.168.1.100
rangeEnd: 192.168.1.200
domain: home.arpa
---
apiVersion: v1alpha1
kind: DHCPServerConfig
name: servers
link: srv0
rangeStart: 192.168.30.100
rangeEnd: 192.168.30.150
domain: home.arpa
staticLeases:
  - mac: 52:54:00:00:00:10
    address: 192.168.30.10
    hostname: nas
---
# Caching DNS for the inside zones; DHCP clients resolve as <hostname>.home.arpa.
apiVersion: v1alpha1
kind: DNSServerConfig
listenLinks: [lan0, srv0, wg0]
upstreams: [9.9.9.9, 2620:fe::fe]
localDomain: home.arpa
---
# IPv6: SLAAC on the LAN and the servers VLAN.
apiVersion: v1alpha1
kind: RouterAdvertisementConfig
name: lan
link: lan0
prefixes: [fd00:1::/64]
---
apiVersion: v1alpha1
kind: RouterAdvertisementConfig
name: servers
link: srv0
prefixes: [fd00:30::/64]
