---
# lan0 on the VM's second NIC: the test's client is behind it
apiVersion: v1alpha1
kind: LinkAliasConfig
name: lan0
selector:
  match: mac(link.permanent_addr) == "$LANMAC"
---
apiVersion: v1alpha1
kind: LinkConfig
name: lan0
up: true
addresses:
  - address: 192.168.50.1/24
  - address: fd00:50::1/64
---
# the guests' VLAN (persona 04-guests), tagged on the LAN NIC
apiVersion: v1alpha1
kind: VLANConfig
name: guest0
vlanID: 20
parent: lan0
up: true
addresses:
  - address: 192.168.60.1/24
---
# remote access (persona 04-homelab): the peer is the test's laptop on the road
apiVersion: v1alpha1
kind: WireguardConfig
name: wg0
privateKeyFile: secrets/wg0.key
listenPort: 51820
peers:
  - publicKey: $WGPEER
    allowedIPs:
      - 10.8.0.2/32
up: true
addresses:
  - address: 10.8.0.1/24
