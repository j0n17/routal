---
# lan0 on the VM's second NIC: the test's client is behind it. The WAN is selected by its MAC
# address (talos.yaml); this one by where it sits on the PCI bus, the other way to name a NIC that
# does not depend on the order the kernel finds them in (QEMU: the second NIC is in slot 3).
apiVersion: v1alpha1
kind: LinkAliasConfig
name: lan0
selector:
  match: link.bus_path == "0000:00:03.0"
---
apiVersion: v1alpha1
kind: LinkConfig
name: lan0
up: true
addresses:
  - address: 192.168.50.1/24
  - address: fd00:50::1/64
---
# the guests' VLAN (persona 04-guests), tagged on the LAN NIC
apiVersion: v1alpha1
kind: VLANConfig
name: guest0
vlanID: 20
parent: lan0
up: true
addresses:
  - address: 192.168.60.1/24
---
# remote access (persona 04-homelab): the peer is the test's laptop on the road
apiVersion: v1alpha1
kind: WireguardConfig
name: wg0
privateKeyFile: secrets/wg0.key
listenPort: 51820
peers:
  - publicKey: $WGPEER
    allowedIPs:
      - 10.8.0.2/32
up: true
addresses:
  - address: 10.8.0.1/24
