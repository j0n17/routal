# Talos side of the console player's router.
# Interfaces: the names the kernel gives, as they are. The simplest: nothing to declare. They follow
# the PCI slots (enp0s2 is slot 2), so they hold as long as no card is added or moved.
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: gamer
---
# The test VM boots an image that already holds Talos with the extension. A real install names
# its own installer here instead (see examples/reference/talos.yaml).
apiVersion: v1alpha1
kind: UnattendedInstallConfig
$patch: delete
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: enp0s2
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp0s3
up: true
addresses:
  - address: 192.168.50.1/24
  - address: fd00:50::1/64
---
# Traffic to the router itself is blocked unless opened (routald opens what `to: self` rules need).
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
# The Talos API from where the test drives the router.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: talos-api
portSelector:
  ports: [50000]
  protocol: tcp
ingress:
  - subnet: $SUBNET
