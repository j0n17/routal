# A homelab: a NAS and a web server with fixed addresses and names, both published to the Internet
# on their own port, and a WireGuard VPN to reach the whole LAN from a laptop on the road.
apiVersion: v1alpha1
kind: FirewallZoneConfig
name: wan
links: [wan0]
---
apiVersion: v1alpha1
kind: FirewallZoneConfig
name: lan
links: [lan0]
---
apiVersion: v1alpha1
kind: FirewallZoneConfig
name: vpn
links: [wg0]
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: lan-to-wan
from: lan
to: wan
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: lan-dns-dhcp
from: lan
to: self
protocol: udp
ports: [53, 67]
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: lan-dns-tcp
from: lan
to: self
protocol: tcp
ports: [53]
---
# The test drives the router from its WAN side: without this rule it locks itself out.
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: admin-from-host
from: wan
to: self
protocol: tcp
ports: [50000]
sourceSubnets: [$SUBNET]
---
# The VPN itself: the one thing the router answers from the Internet.
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: wireguard
from: wan
to: self
protocol: udp
ports: [51820]
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: vpn-to-lan
from: vpn
to: lan
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: vpn-dns
from: vpn
to: self
protocol: udp
ports: [53]
---
apiVersion: v1alpha1
kind: MasqueradeConfig
name: lan-out
outLink: wan0
sourceSubnets: [192.168.50.0/24]
---
apiVersion: v1alpha1
kind: DHCPServerConfig
name: lan
link: lan0
rangeStart: 192.168.50.100
rangeEnd: 192.168.50.200
domain: home.arpa
staticLeases:
  - mac: 52:54:00:d4:00:40
    address: 192.168.50.10
    hostname: nas
  - mac: 52:54:00:d4:00:41
    address: 192.168.50.11
    hostname: web
---
apiVersion: v1alpha1
kind: DNSServerConfig
listenLinks: [lan0, wg0]
upstreams: [9.9.9.9, 149.112.112.112]
localDomain: home.arpa
---
apiVersion: v1alpha1
kind: PortForwardConfig
name: nas
inLink: wan0
protocol: tcp
ports: [8080]
toAddress: 192.168.50.10
---
# The web server listens on 8080 too: published on another port.
apiVersion: v1alpha1
kind: PortForwardConfig
name: web
inLink: wan0
protocol: tcp
ports: [8081]
toAddress: 192.168.50.11
toPort: 8080
---
apiVersion: v1alpha1
kind: FirewallRuleConfig
name: wan-to-published
from: wan
to: lan
protocol: tcp
ports: [8080]
destinationSubnets: [192.168.50.10/32, 192.168.50.11/32]
