# Talos side of the hotel router.
# Interfaces: every port of one kind of NIC, numbered. For identical boxes bought in series: one
# file fits them all, whatever their MAC addresses; net0 is the first port, net1 the second.
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: hotel
---
# The test VM boots an image that already holds Talos with the extension. A real install names
# its own installer here instead (see examples/reference/talos.yaml).
apiVersion: v1alpha1
kind: UnattendedInstallConfig
$patch: delete
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net%d
selector:
  match: link.driver == "virtio_net"
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: net0
---
apiVersion: v1alpha1
kind: LinkConfig
name: net1
up: true
addresses:
  - address: 192.168.50.1/24
  - address: fd00:50::1/64
---
# The guests' network, tagged 20 on the LAN port
apiVersion: v1alpha1
kind: VLANConfig
name: guest0
vlanID: 20
parent: net1
up: true
addresses:
  - address: 192.168.60.1/24
---
# Traffic to the router itself is blocked unless opened (routald opens what `to: self` rules need).
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
# The Talos API from where the test drives the router.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: talos-api
portSelector:
  ports: [50000]
  protocol: tcp
ingress:
  - subnet: $SUBNET
