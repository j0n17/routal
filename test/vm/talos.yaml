# Talos side of the VM boot test (hack/vm-test.sh): the VM's one NIC is the WAN, two dummy links
# stand for LANs so that every daemon has something to listen on.
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: routal-vm
---
# the image already holds Talos with the extension: the stock installer would drop it
apiVersion: v1alpha1
kind: UnattendedInstallConfig
$patch: delete
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: wan0
selector:
  match: mac(link.permanent_addr) == "$MAC"
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: wan0
---
apiVersion: v1alpha1
kind: DummyLinkConfig
name: lan0
up: true
addresses:
  - address: 192.168.50.1/24
  - address: fd00:50::1/64
---
apiVersion: v1alpha1
kind: DummyLinkConfig
name: iot0
up: true
addresses:
  - address: 192.168.51.1/24
---
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: talos-api
portSelector:
  ports: [50000]
  protocol: tcp
ingress:
  - subnet: $SUBNET
