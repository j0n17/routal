  <circle cx="128" cy="128" r="90" fill="url(#shine)"/>
  <g fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 128h38m-17-17 17 17-17 17"/>
    <path d="M194 128h-38m17-17-17 17 17 17"/>
