<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 96" role="img" aria-label="routal">
  <!-- The name as a terminal shows it, "ro" in reverse video: ro is also how the root of Talos is
       mounted, read-only. Ink and paper follow the reader's color scheme. -->
  <style>
    .ink { fill: #111418; } .paper { fill: #ffffff; }
    @media (prefers-color-scheme: dark) { .ink { fill: #f0f3f6; } .paper { fill: #0d1117; } }
    text { font: 700 64px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
  </style>
  <rect class="ink" x="8" y="12" width="92.8" height="72"/>
  <text class="paper" x="16" y="70" textLength="76.8" lengthAdjust="spacingAndGlyphs">ro</text>
  <text class="ink" x="108.8" y="70" textLength="153.6" lengthAdjust="spacingAndGlyphs">utal</text>
</svg>
